name: Deploy to S3
on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::361960318571:role/GitHub-bzlink-deploy-role
          aws-region: ca-central-1

      - name: Deploy to S3
        run: aws s3 sync . s3://bzlink-practice-site --delete --exclude ".git/*" --exclude ".github/*" --exclude "README.md"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E3AHEKHTAACZH6 --paths "/*"
